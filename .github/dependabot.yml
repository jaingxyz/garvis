version: 2
updates:
  # Python dependencies (pyproject.toml + requirements*.txt).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it, so a compromised
    # or broken publish has time to be caught (supply-chain hardening).
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - python
    commit-message:
      prefix: chore
      include: scope

  # GitHub Actions. Workflows pin to commit SHAs; Dependabot bumps the SHA
  # (and its version comment) in lockstep with the tag's underlying commit.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it, so a compromised
    # or broken publish has time to be caught (supply-chain hardening).
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
