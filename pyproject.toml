[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garvis"
version = "0.1.0"
description = "Local edge-only personal triage + voice agent (Ollama + local MCPs)"
readme = "README.md"
requires-python = ">=3.12"
# Floors match what the code actually uses (LangChain 1.x message/content API,
# langchain-mcp-adapters 0.3 tool loading). mcp is capped below 2.0 because
# langchain-mcp-adapters 0.3.x requires mcp<2.
dependencies = [
    "langchain>=1.3.9,<2",
    "langchain-core>=1.3.3,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-mcp-adapters>=0.3,<1",
    "mcp>=1.24,<2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
voice = [
    "av==18.1.0",
    "ctranslate2==4.8.2",
    "faster-whisper==1.2.1",
    "numpy==2.5.3",
    "onnxruntime==1.30.0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "sounddevice==0.5.6",
    "tokenizers==0.23.2",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
dev = [
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["garvis*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TID", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["garvis"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
