# Garvis config — copy this to config.yaml and fill in your own values.
#   cp config.example.yaml config.yaml
# config.yaml is gitignored (it holds your personal addresses + paths).

llm:
  provider: ollama
  model: qwen2.5:14b          # stronger instruction-following than 7b (date discipline, grouping)
  base_url: http://localhost:11434
  temperature: 0

# Safety: when true, Garvis classifies and writes the digest but DELETES NOTHING.
# Keep this true until you trust the classification, then flip to false.
dry_run: true

# WhatsApp cleanup is an extra opt-in on top of dry_run. A WhatsApp "delete" clears a WHOLE
# conversation from your devices (delete-for-me — it never affects the other person, and is
# never delete-for-everyone). Even with dry_run:false, no WhatsApp chat is touched unless this
# is true, and only PROMOTION-labeled conversations are ever eligible.
allow_whatsapp_delete: false

# SMS cleanup is an extra opt-in on top of dry_run. Deleting a text clears the WHOLE
# conversation from Google Messages, though it goes to the Messages Trash (recoverable).
# When enabled, only automated senders you have NEVER replied to are eligible: unknown
# numbers / short codes (no saved contact name) plus the senders/patterns listed below.
#   - PROMOTION / UPDATE / CONCLUDED / UNSURE from an unknown number: trashed on the next sweep
#   - ACTIONABLE / PERSONAL from an unknown number: trashed after stale_notification_days
#   - listed notification senders/patterns: trashed regardless of label
# Saved contacts and any thread with a reply from you are never touched; protection rules
# and the OTP grace window still apply. Checking for your reply opens the thread in the
# Messages web UI (marking it read), so it only happens for threads about to be trashed and
# never in dry_run — dry-run digests therefore list no text deletions.
allow_sms_delete: false
# Named threads that are really machine notifications (exact name, case-insensitive), and
# regexes matched against a thread's latest text. Carrier voicemail alerts often land in a
# thread named after your own number — a pattern catches those without naming the thread.
sms_notification_senders: []
sms_notification_patterns:
  - "voice ?mail"

# A notification thread you have already READ and that has had no new message in this many
# days is spent — trashed even if you once replied in it. A thread with unread messages is
# never trashed, and Garvis never opens (and so never marks read) an unread thread.
sms_read_stale_days: 3

# An automated thread (unknown number / short code / listed sender) with no new message in
# this many days goes even if you never opened it — an unread alert from a month ago is junk.
sms_stale_any_days: 30

# A thread with a SAVED CONTACT name this old is trashed only when the model labels it
# PROMOTION / UPDATE / CONCLUDED — i.e. a business or service, not a person. Anything it
# calls PERSONAL / ACTIONABLE / WAITING / UNSURE is kept however old it is.
sms_named_stale_days: 30

# When true, ANY named thread silent for sms_named_stale_days that is not in
# sms_personal_contacts is trashed — the list below, not the model's PERSONAL label, is
# what keeps a person's thread. Keep this false unless that list is complete.
sms_trash_unlisted_named: false

# protected_keywords stop shielding a TEXT thread once it has been silent this long: an
# old "your password was changed" or "invoice ready" SMS is spent. Starred/VIP/attachment
# protection and the fresh one-time-code rule are unaffected. Unset to protect forever.
sms_keyword_protection_days: 90

# Keywords that protect MAIL but not a text. A password/security-alert SMS is a spent
# notification — the code inside it is handled by otp_grace_minutes, not by this list.
sms_unprotected_keywords: []
  # - password
  # - security alert

# Real people — these threads are NEVER auto-trashed, whatever the model decides. Matched
# as a case-insensitive substring, so a name also covers group threads it appears in.
sms_personal_contacts: []
  # - Alex Example
  # - Mum

# Text threads older than this are never sent to the LLM: they can't be a fresh task and the
# briefing only covers recent activity. They are still cleaned up by the rules above. This is
# what keeps a deep scan (scan_limits.messages) affordable.
sms_classify_max_age_days: 14

# Delivery/service alerts whose job is finished — trashed regardless of label or age.
# These deliberately miss in-flight updates like "out for delivery" / "arriving today".
sms_completed_patterns:
  - "\\b(was|been|is)? ?delivered\\b"
  - "\\bdelivery (is |was )?complete"
  - "\\b(repair|order|service|installation|appointment) is complete"
  - "\\bhas been completed\\b"
  - "\\bpicked up\\b"

window_days: 3                # first run / fallback look-back window
owner_gmail: you@example.com
owner_outlook: you-outlook@example.com

# Deterministic protection — items matching these are NEVER deleted, regardless of how
# the LLM classifies them. (config/rules.md is the human-readable companion.)
vip_senders:                  # threads with these senders are always kept
  - partner@example.com
  - work@example.com
  - relocation@example.com
protected_keywords:
  # "receipt" intentionally NOT here — receipts are treated as deletable updates.
  # One-time codes are handled by a time rule (otp_grace_minutes), not this list.
  - invoice
  - statement
  - refund
  - tax
  - legal
  - contract
  - agreement
  - lawsuit
  - security alert
  - password
  - payroll
  - offer letter
  - visa
  - passport
  - mortgage
  - escrow
  - lease
  - deposit
  - docusign
  - notary

# One-time / verification codes are protected only while fresh; after this many minutes
# they are expired noise and become deletable. Email uses the message date; SMS/WhatsApp
# carry no timestamp, so age is measured from when Garvis first saw the code (the sweep
# that discovers it stamps the time; once that many minutes pass it is trashed).
otp_grace_minutes: 5

# Texts from unknown numbers / short codes (no saved contact name) that you have never
# replied to are trashed once allow_sms_delete is on. Anything the model calls
# ACTIONABLE or PERSONAL gets this many days (from when Garvis first saw it) before it is
# treated as a stale notification and trashed too. Threads you have replied in are never
# auto-trashed.
stale_notification_days: 7

scan_limits:
  gmail: 60
  outlook: 60
  messages: 20
  whatsapp: 20

# Local MCP servers, launched directly over stdio. Point args at wherever you cloned
# each server. node_bin is optional — omit it to use `node` from your PATH, or set the
# GARVIS_NODE_BIN env var.
node_bin: node
mcp_servers:
  personal-gmail:
    args: ["/path/to/personal-gmail-mcp/dist/index.js"]
    env: {}
  personal-outlook:
    args: ["/path/to/personal-outlook-mcp/dist/index.js"]
    env:
      AZURE_CLIENT_ID: "YOUR_AZURE_CLIENT_ID"   # your Azure app registration client id
      AZURE_TENANT: "consumers"
  google-messages:
    # Launches a Chromium profile; fails if that profile is already open elsewhere.
    enabled: true
    args: ["/path/to/google-messages-app/src/server.mjs"]
    env:
      GM_HEADLESS: "true"
  whatsapp:
    # Optional: WhatsApp as a triage source via a Baileys-based whatsapp-mcp.
    enabled: false
    args: ["/path/to/whatsapp-mcp/dist/index.js"]
    env: {}

paths:
  playbook: PLAYBOOK.md
  rules: config/rules.md
  state: state/last-run.json
  digests: digests
  db: state/garvis.db

# Optional voice-daemon overrides (see garvis/voice/). All have sensible defaults.
# voice:
#   wake_model: tiny.en
#   command_model: base.en
#   tts_voice: Daniel
#   wake_words: [garvis, jarvis]
#   conversation_mode_seconds: 25   # keep listening for follow-ups after an answer
#   allow_voice_send: false         # set true to let voice actually SEND email (outward!)
